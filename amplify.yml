version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 15 needs Node 18.18+; pin Node 20 LTS on the Amplify build image
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # Amplify Hosting (WEB_COMPUTE platform) deploys Next.js SSR from .next
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
